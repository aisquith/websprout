name = "websprout"
main = "dist/worker.js"
compatibility_date = "2025-01-01"

# Routes the worker runs on. The first two serve the app; the wildcard
# powers your published name.websprout.app sites.
# NOTE: you still add the wildcard DNS record ( * CNAME websprout.app, Proxied )
# in the dashboard — routes and DNS are separate.
# Keep this ABOVE any [[table]] block: in TOML, keys written after a table
# header belong to that table, so wrangler would silently ignore the routes.
routes = [
  { pattern = "websprout.app/*", zone_name = "websprout.app" },
  { pattern = "www.websprout.app/*", zone_name = "websprout.app" },
  { pattern = "*.websprout.app/*", zone_name = "websprout.app" },
  # Customers' own domains (Cloudflare for SaaS custom hostnames) reach the worker through this.
  { pattern = "*/*", zone_name = "websprout.app" }
]

# The worker is assembled from src/ by build.js (dist/ is generated, not committed).
# Wrangler runs this before every `wrangler dev` and `wrangler deploy`.
[build]
command = "node build.js"
watch_dir = "src"

# Your KV store — you already have one bound in the dashboard: WEBSPROUT_KV.
# Storage & Databases -> KV -> (your namespace) -> copy the Namespace ID.
[[kv_namespaces]]
binding = "KV"
id = "f5def57998654229973b809dd4f3a463"

# Analytics database (Cloudflare D1, free tier). Create it once, paste its id below, apply the migration:
#   npx wrangler d1 create websprout-analytics
#   npx wrangler d1 migrations apply websprout-analytics --remote
# Until the binding works the worker falls back to the old KV event log, so nothing breaks.
[[d1_databases]]
binding = "DB"
database_name = "websprout-analytics"
database_id = "1fcf24a1-d24d-4172-8db5-d38f4ad8ee62"
migrations_dir = "migrations"

# Your secrets (GEMINI_API_KEY, RESEND_API_KEY, FORM_SECRET, GODADDY_KEY,
# GODADDY_SECRET, GODADDY_AFFILIATE) are NOT listed here. Keep them in the
# Cloudflare dashboard (Settings -> Variables and Secrets) — they persist
# across deploys and stay encrypted.

[triggers]
# Daily: weekly lead digest (self-limits to once every 6 days), sign-up nudges, error alert to the owner.
crons = ["0 15 * * *"]
